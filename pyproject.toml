[project]
name = "resetpath"
version = "0.1.0"
description = "A private, local-first wellbeing and placement-progress app."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "flet==0.86.2",
    "flet-charts==0.86.2",
    "pandas==3.0.3",
]

[project.optional-dependencies]
dev = [
    "flet-desktop==0.86.2",
    "flet-web==0.86.2",
]

[tool.flet]
product = "ResetPath"
org = "com.atnik"
bundle_id = "com.atnik.resetpath"
company = "ResetPath"
copyright = "Copyright 2026 ResetPath"
compile_app = true

[tool.flet.app]
path = "."

[tool.flet.android]
min_sdk_version = 24
adaptive_icon_background = "#F4F7F5"

[tool.flet.android.manifest_application]
allowBackup = "false"
usesCleartextTraffic = "false"

[tool.flet.splash]
color = "#F4F7F5"
dark_color = "#111B1A"
